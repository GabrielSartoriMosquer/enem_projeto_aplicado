name: Panorama (API e frontend)
on:
  push:
    paths: ['panorama/**', '.github/workflows/panorama.yml']
  pull_request:
    paths: ['panorama/**', '.github/workflows/panorama.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panorama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest --cov=backend/app --cov-fail-under=60
      - run: ruff check backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panorama/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panorama/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:utils
      - run: npm run build
